# Go Linters - GitHub Actions
name: linters

on: [push, pull_request]
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-go@v5
      with:
        go-version: "1.26"
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Run required linters in .golangci.yml plus hard-coded ones here
      run: make -w lint
